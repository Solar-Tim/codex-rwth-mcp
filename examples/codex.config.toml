# User-level example: ~/.codex/config.toml
[mcp_servers.codex_deep_loop]
command = "/absolute/path/to/codex-deep-loop-mcp/.venv/bin/python"
args = ["-m", "codex_rwth_mcp"]
cwd = "/absolute/path/to/codex-deep-loop-mcp"
startup_timeout_sec = 10
tool_timeout_sec = 120
enabled = true
enabled_tools = [
  "summarize_logs",
  "summarize_repo",
  "analyze_screenshot",
  "summarize_diff",
  "deep_debug_loop",
  "deep_diff_review",
  "repo_map_loop",
  "deep_repo_review_loop",
  "deep_test_strategy_loop",
  "deep_architecture_critic",
  "external_repo_scan_loop",
  "coding_task_loop",
  "usage_report",
]
env_vars = ["RWTH_OPENAI_API_KEY"]

[mcp_servers.codex_deep_loop.env]
CODEX_DEEP_LOOP_MCP_CONFIG = "/absolute/path/to/codex-deep-loop-mcp/config/routing.yaml"

# Prefer forwarding the secret from the local environment instead of storing it
# in config.toml.

# Alternative CLI setup:
# codex mcp add codex_deep_loop \
#   --env CODEX_DEEP_LOOP_MCP_CONFIG=/absolute/path/to/codex-deep-loop-mcp/config/routing.yaml \
#   --env RWTH_OPENAI_API_KEY="$RWTH_OPENAI_API_KEY" \
#   -- /absolute/path/to/codex-deep-loop-mcp/.venv/bin/python -m codex_rwth_mcp
